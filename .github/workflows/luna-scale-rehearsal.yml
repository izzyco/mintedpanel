name: Luna Scale Rehearsal

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/luna-scale/**"
      - ".github/workflows/luna-scale-rehearsal.yml"
  pull_request:
    paths:
      - "scripts/luna-scale/**"
      - ".github/workflows/luna-scale-rehearsal.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  luna-scale-seed:
    name: Luna-scale seed (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Restore Supabase built-in registry fallback
        shell: bash
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Start and reset local Supabase
        shell: bash
        run: |
          set -euo pipefail
          luna_workdir="$RUNNER_TEMP/mintedpanel-luna"
          mkdir -p "$luna_workdir"
          cp -R supabase "$luna_workdir/supabase"
          printf '\n[db.seed]\nenabled = false\n' >> "$luna_workdir/supabase/config.toml"
          # The seed sends no mail; skipping the mail catcher avoids its fixed
          # host port (54324), which collided on a runner, and one image pull.
          printf '\n[inbucket]\nenabled = false\n' >> "$luna_workdir/supabase/config.toml"
          # Same duplicate-version workaround as the UAT seed job: the isolated
          # copy gives the second 20260903210000 file its next timestamp.
          mv "$luna_workdir/supabase/migrations/20260903210000_delete_org_sop_template.sql" \
             "$luna_workdir/supabase/migrations/20260903210001_delete_org_sop_template.sql"
          echo "LUNA_SUPABASE_WORKDIR=$luna_workdir" >> "$GITHUB_ENV"
          supabase --workdir "$luna_workdir" start
          supabase --workdir "$luna_workdir" db reset --no-seed
      - name: Point the seed at the loopback stack
        shell: bash
        run: |
          set -euo pipefail
          status_json="$(supabase --workdir "$LUNA_SUPABASE_WORKDIR" status -o json)"
          api_url="$(jq -r '.API_URL // empty' <<<"$status_json")"
          db_url="$(jq -r '.DB_URL // empty' <<<"$status_json")"
          service_key="$(jq -r '.SERVICE_ROLE_KEY // empty' <<<"$status_json")"
          test -n "$api_url"
          test -n "$db_url"
          test -n "$service_key"
          echo "::add-mask::$service_key"
          luna_org="$(node -e 'import("./scripts/luna-scale/luna-fixture.mjs").then((m) => console.log(m.LUNA_ORG_ID))')"
          {
            echo "SUPABASE_URL=$api_url"
            echo "LUNA_DATABASE_URL=$db_url"
            echo "UAT_DATABASE_URL=$db_url"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service_key"
            echo "LUNA_ORG=$luna_org"
          } >> "$GITHUB_ENV"
      - name: Seed the UAT fixture as pre-existing data
        shell: bash
        run: |
          set -euo pipefail
          export UAT_SHARED_PASSWORD="$(openssl rand -base64 24)Aa1!"
          npm run seed:staging-uat
      - name: Create a member login and a login that belongs to a UAT org
        shell: bash
        run: |
          set -euo pipefail
          create_user() {
            curl -fsS -X POST "$SUPABASE_URL/auth/v1/admin/users" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"$1\",\"password\":\"$(openssl rand -hex 16)Aa1!\",\"email_confirm\":true}" |
              jq -r '.id'
          }
          member_id="$(create_user ci.luna.member@example.test)"
          uat_member_id="$(create_user ci.luna.uat-member@example.test)"
          uuid_re='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          [[ "$member_id" =~ $uuid_re ]]
          [[ "$uat_member_id" =~ $uuid_re ]]
          uat_org="$(node -e 'import("./scripts/uat/uat-fixture.mjs").then((m) => console.log(m.ids.organizations[0]))')"
          psql "$LUNA_DATABASE_URL" -X -q -v ON_ERROR_STOP=1 \
            -v member_id="$member_id" -v uat_member_id="$uat_member_id" -v uat_org="$uat_org" <<'SQL'
          INSERT INTO public.profiles (id, email, full_name) VALUES
            (:'member_id', 'ci.luna.member@example.test', 'CI Luna Member'),
            (:'uat_member_id', 'ci.luna.uat-member@example.test', 'CI UAT Member')
          ON CONFLICT (id) DO NOTHING;
          INSERT INTO public.memberships (org_id, user_id, role) VALUES (:'uat_org', :'uat_member_id', 'specialist');
          SQL
          {
            echo "LUNA_MEMBER_ID=$member_id"
            echo "LUNA_UAT_MEMBER_ID=$uat_member_id"
          } >> "$GITHUB_ENV"
      - name: Fingerprint every row outside the Luna org
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent verify:luna-scale -- --local-rehearsal --fingerprint > "$RUNNER_TEMP/outside-before.json"
          jq -e 'length > 0' "$RUNNER_TEMP/outside-before.json" > /dev/null
      - name: Dry run
        run: npm run seed:luna-scale -- --dry-run --local-rehearsal --member-email ci.luna.member@example.test
      - name: Apply
        run: npm run seed:luna-scale -- --apply --local-rehearsal --confirm "SEED LUNA SCALE ON local" --member-email ci.luna.member@example.test
      - name: Verify every table against the planned counts
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:luna-scale -- --local-rehearsal
          test "$(psql "$LUNA_DATABASE_URL" -X -At -c "select count(*) from public.memberships where org_id = '$LUNA_ORG' and user_id = '$LUNA_MEMBER_ID' and role = 'admin'")" = 1
      - name: A second apply rebuilds the org (teardown plus insert)
        shell: bash
        run: |
          set -euo pipefail
          case_numbers() {
            psql "$LUNA_DATABASE_URL" -X -At -c "select md5(string_agg(id::text || ':' || case_number::text, ',' order by id)) from public.credential_cases where org_id = '$LUNA_ORG'"
          }
          first_case_numbers="$(case_numbers)"
          npm run seed:luna-scale -- --apply --local-rehearsal --confirm "SEED LUNA SCALE ON local" --member-email ci.luna.member@example.test
          npm run verify:luna-scale -- --local-rehearsal
          test "$(case_numbers)" != "$first_case_numbers"
          test "$(psql "$LUNA_DATABASE_URL" -X -At -c "select count(*) from public.memberships where org_id = '$LUNA_ORG'")" = 1
      - name: A member of a UAT org is refused and the transaction rolls back
        shell: bash
        run: |
          set -euo pipefail
          case_numbers() {
            psql "$LUNA_DATABASE_URL" -X -At -c "select md5(string_agg(id::text || ':' || case_number::text, ',' order by id)) from public.credential_cases where org_id = '$LUNA_ORG'"
          }
          before="$(case_numbers)"
          if output="$(npm run seed:luna-scale -- --apply --local-rehearsal --confirm "SEED LUNA SCALE ON local" --member-email ci.luna.uat-member@example.test 2>&1)"; then
            echo "$output"
            echo "::error::the seed accepted a member of a UAT org"
            exit 1
          fi
          echo "$output"
          grep -q "the member belongs to a UAT fixture org" <<<"$output"
          test "$(case_numbers)" = "$before"
          test "$(psql "$LUNA_DATABASE_URL" -X -At -c "select count(*) from public.memberships where org_id = '$LUNA_ORG' and user_id = '$LUNA_UAT_MEMBER_ID'")" = 0
          npm run verify:luna-scale -- --local-rehearsal
      - name: Data outside the Luna org is unchanged after the applies
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent verify:luna-scale -- --local-rehearsal --fingerprint > "$RUNNER_TEMP/outside-after-apply.json"
          diff "$RUNNER_TEMP/outside-before.json" "$RUNNER_TEMP/outside-after-apply.json"
      - name: Teardown
        shell: bash
        run: |
          set -euo pipefail
          npm run seed:luna-scale -- --dry-run --teardown --local-rehearsal
          npm run seed:luna-scale -- --teardown --local-rehearsal --confirm "TEAR DOWN LUNA SCALE ON local"
      - name: The org is inactive, with no seed rows and no members
        run: npm run verify:luna-scale -- --local-rehearsal
      - name: A refused apply on the inactive org rolls back
        shell: bash
        run: |
          set -euo pipefail
          if output="$(npm run seed:luna-scale -- --apply --local-rehearsal --confirm "SEED LUNA SCALE ON local" --member-email ci.luna.uat-member@example.test 2>&1)"; then
            echo "$output"
            echo "::error::the seed accepted a member of a UAT org"
            exit 1
          fi
          echo "$output"
          grep -q "the member belongs to a UAT fixture org" <<<"$output"
          test "$(psql "$LUNA_DATABASE_URL" -X -At -c "select lifecycle_state from public.organizations where id = '$LUNA_ORG'")" = inactive
          npm run verify:luna-scale -- --local-rehearsal
      - name: Data outside the Luna org is unchanged after the teardown
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent verify:luna-scale -- --local-rehearsal --fingerprint > "$RUNNER_TEMP/outside-after-teardown.json"
          diff "$RUNNER_TEMP/outside-before.json" "$RUNNER_TEMP/outside-after-teardown.json"
      - name: The inactive org re-seeds and tears down again
        shell: bash
        run: |
          set -euo pipefail
          npm run seed:luna-scale -- --apply --local-rehearsal --confirm "SEED LUNA SCALE ON local"
          npm run verify:luna-scale -- --local-rehearsal
          npm run seed:luna-scale -- --teardown --local-rehearsal --confirm "TEAR DOWN LUNA SCALE ON local"
          npm run verify:luna-scale -- --local-rehearsal
          npm run --silent verify:luna-scale -- --local-rehearsal --fingerprint > "$RUNNER_TEMP/outside-final.json"
          diff "$RUNNER_TEMP/outside-before.json" "$RUNNER_TEMP/outside-final.json"
      - name: A row outside the Luna org that a delete would change blocks the apply and the teardown
        shell: bash
        run: |
          set -euo pipefail
          npm run seed:luna-scale -- --apply --local-rehearsal --confirm "SEED LUNA SCALE ON local"
          payer="$(psql "$LUNA_DATABASE_URL" -X -At -c "select id from public.payers where org_id = '$LUNA_ORG' order by id limit 1")"
          test -n "$payer"
          psql "$LUNA_DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -v payer="$payer" <<'SQL'
          INSERT INTO public.portals (org_id, portal_key, name, payer_id)
          VALUES (NULL, 'ci-luna-guard-probe', 'CI Luna guard probe', :'payer');
          SQL
          probe_payer() {
            psql "$LUNA_DATABASE_URL" -X -At -c "select payer_id from public.portals where org_id is null and portal_key = 'ci-luna-guard-probe'"
          }
          for action in teardown apply; do
            if [ "$action" = teardown ]; then
              args=(--teardown --confirm "TEAR DOWN LUNA SCALE ON local")
            else
              args=(--apply --confirm "SEED LUNA SCALE ON local")
            fi
            if output="$(npm run seed:luna-scale -- --local-rehearsal "${args[@]}" 2>&1)"; then
              echo "$output"
              echo "::error::the $action changed a global portal through ON DELETE SET NULL"
              exit 1
            fi
            echo "$output"
            grep -q "rows outside the Luna org reference Luna rows" <<<"$output"
            grep -q "portals_payer_id_fkey" <<<"$output"
            test "$(probe_payer)" = "$payer"
            test "$(psql "$LUNA_DATABASE_URL" -X -At -c "select lifecycle_state from public.organizations where id = '$LUNA_ORG'")" = active
            npm run verify:luna-scale -- --local-rehearsal
          done
          psql "$LUNA_DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -c "delete from public.portals where org_id is null and portal_key = 'ci-luna-guard-probe'"
          npm run seed:luna-scale -- --teardown --local-rehearsal --confirm "TEAR DOWN LUNA SCALE ON local"
          npm run verify:luna-scale -- --local-rehearsal
