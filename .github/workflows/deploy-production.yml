name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production release'
        required: true
        default: "deploy"

concurrency:
  group: minted-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Vercel Production
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Verify build locally
        env:
          VITE_MINTED_EXTENSION_ID: dppfnbikpojpgdiobckgcknmkjlfoinh
          NITRO_PRESET: vercel
          VERCEL: "1"
        run: npm run build

      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_230fpJ9MgCj9ssW3LiIckfyA
          VERCEL_PROJECT_ID: prj_ILhPJbkyaiptdVA8DtsmNyw3tiub
          VITE_MINTED_EXTENSION_ID: dppfnbikpojpgdiobckgcknmkjlfoinh
          NITRO_PRESET: vercel
          VERCEL: "1"
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          DEPLOY_OUTPUT=$(npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "$DEPLOY_OUTPUT"
          DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[^ ]*vercel\.app' | tail -n 1)
          DEPLOY_HOST=$(echo "$DEPLOY_URL" | sed -e 's|^https://||' -e 's|/$||')
          echo "Detected deployment host: $DEPLOY_HOST"
          if [ -n "$DEPLOY_HOST" ]; then
            echo "Assigning www.mintedpanel.com..."
            curl -f -s -X POST "https://api.vercel.com/v2/deployments/${DEPLOY_HOST}/aliases?teamId=${VERCEL_ORG_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"alias":"www.mintedpanel.com"}' || npx vercel alias set "$DEPLOY_HOST" www.mintedpanel.com --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
            echo "Assigning mintedpanel.vercel.app..."
            curl -f -s -X POST "https://api.vercel.com/v2/deployments/${DEPLOY_HOST}/aliases?teamId=${VERCEL_ORG_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"alias":"mintedpanel.vercel.app"}' || npx vercel alias set "$DEPLOY_HOST" mintedpanel.vercel.app --scope="$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
          fi

      - name: Verify live production endpoints
        run: |
          echo "Waiting 5 seconds for edge routing..."
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://www.mintedpanel.com/api/health)
          echo "https://www.mintedpanel.com/api/health status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Expected 200 from api/health, got $STATUS"
            exit 1
          fi

          HOME_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://www.mintedpanel.com/)
          echo "https://www.mintedpanel.com/ status: $HOME_STATUS"
          if [ "$HOME_STATUS" != "200" ]; then
            echo "Expected 200 from home page, got $HOME_STATUS"
            exit 1
          fi

          echo "Verifying extension ID in production bundle..."
          HTML=$(curl -s -L https://www.mintedpanel.com/)
          BUNDLE_PATH=$(echo "$HTML" | grep -a -o '/assets/index-[^"]*\.js' | head -n 1)
          echo "Found bundle: $BUNDLE_PATH"
          if [ -n "$BUNDLE_PATH" ]; then
            curl -s -L "https://www.mintedpanel.com$BUNDLE_PATH" | grep -a -q "dppfnbikpojpgdiobckgcknmkjlfoinh"
            echo "Successfully verified: production bundle inlines extension ID dppfnbikpojpgdiobckgcknmkjlfoinh"
          fi

          echo "Production deployment verified successfully!"
