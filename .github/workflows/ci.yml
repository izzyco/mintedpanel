name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "review-artifacts/**"
      - "release-artifacts/**"
      - "audit-*.json"
      - "AUDIT_*"
      - "CURRENT_STATE.md"
      - "IDE_HANDOFF_*"
      - ".agents/**"
  push:
    branches: [main, staging]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "review-artifacts/**"
      - "release-artifacts/**"
      - "audit-*.json"
      - "AUDIT_*"
      - "CURRENT_STATE.md"
      - "IDE_HANDOFF_*"
      - ".agents/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast change detection so heavy integration jobs only run when relevant files change.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
      pull-requests: read
    outputs:
      migrations: ${{ steps.filter.outputs.migrations }}
      security: ${{ steps.filter.outputs.security }}
      uat: ${{ steps.filter.outputs.uat }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            migrations:
              - 'supabase/**'
              - 'scripts/migrations/**'
              - '.github/workflows/ci.yml'
            security:
              - 'scripts/security/**'
              - 'src/server/**'
              - 'src/services/**'
              - 'supabase/**'
              - '.github/workflows/ci.yml'
            uat:
              - 'scripts/uat/**'
              - 'supabase/**'
              - '.github/workflows/ci.yml'

  build:
    name: Build, lint, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npx prettier --check .

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify local API isolation fixtures and leak detection
        run: node scripts/verify-isolation-local.mjs

      - name: Build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: e612-build-synthetic-anon-key
        run: npm run build

  release-guardrails:
    name: Release guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The release checks use node:test and built-in modules only.
      # No hosted credentials, deployment or environment approval is needed.
      - name: Check release contract and source controls
        run: npm run test:release

      - name: Install encryption test dependency
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Check encrypted recovery and evidence boundaries
        run: npm run test:recovery

      - name: Check delivery controls and provider adapters with simulated data
        run: npm run test:delivery

      - name: Check backup credential isolation and identity gates
        run: npm run test:backup

      - name: Check the Luna-scale seed generator, SQL and target guards
        run: npm run test:luna-scale

      # In-memory clients only: no network, no keys, no project is touched.
      - name: Check the prod-to-staging catalog sync rules
        run: npm run test:ops

  # Gate 0.5 — Fast Playwright smoke skeleton (login render & unauthenticated guard).
  # Runs in <1 minute. Full 400+ spec regression runs via e2e-full.yml on merge/nightly.
  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Node 22 (not 20): the SSR dev server constructs the Supabase client at
      # module load, and @supabase/realtime-js needs a global WebSocket, which
      # Node 20 lacks (added as a global in Node 22). On Node 20 SSR throws a 500
      # and the webServer never comes up.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Write dummy Supabase env
        run: |
          cat > .env <<'ENV'
          VITE_SUPABASE_URL=https://example.supabase.co
          VITE_SUPABASE_ANON_KEY=dummy-anon-key-for-ci
          ENV

      - name: Run Playwright smoke skeleton
        run: npm run test:e2e:smoke

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 7

  # Consolidated Migration verification & dry-run.
  # Replaces separate migration-runner and migrations jobs into a single Postgres 16 run.
  migrations:
    name: Migration checks & dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (github.event_name != 'pull_request' || needs.changes.outputs.migrations == 'true')
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-migration-test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: synthetic-migration-test
      PGDATABASE: postgres
      MIGRATION_TEST_DATABASE_URL: postgresql://postgres:synthetic-migration-test@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Reject historical SQL rewrites against the event base
        env:
          MINTED_MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:migrations

      - name: Verify real ledger, rerun, failure and schema drift behavior
        run: npm run test:migrations

      - name: Seed Supabase prerequisites
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            email text,
            email_confirmed_at timestamptz,
            banned_until timestamptz,
            deleted_at timestamptz,
            is_anonymous boolean NOT NULL DEFAULT false,
            raw_user_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb,
            raw_app_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb,
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$
            SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid;
          $$;
          CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA public;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp" WITH SCHEMA public;
          SQL

      - name: Apply migrations in filename order
        run: |
          set -euo pipefail
          shopt -s nullglob failglob
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "::group::apply $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done

      - name: Run MINT-107 notification sequences SQL packet
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mint107-notification-sequences.sql

      - name: Run MINT-134 workflow advisories SQL packet
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mint134-workflow-advisories.sql

      - name: Run MINT-108 notification sends SQL packet
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mint108-notification-sends.sql

      - name: Verify portal field-map flywheel RPC on disposable PostgreSQL
        run: node scripts/security/verify-portal-field-map-learning.mjs

      - name: Run MINT-19 / MINT-75 SOP step completion SQL packet
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mint19-atomic-sop.sql
      # MINT-91 U8: a contact saves with a blank office phone (create org,
      # capture link, /contact lead), and every other required field is still
      # refused. Rollback-only; any failed check raises.
      - name: Run MINT-91 contact phone SQL packet
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/mint91-contact-phone-optional.sql

  vault-authorization:
    name: P01 vault authorization
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (github.event_name != 'pull_request' || needs.changes.outputs.security == 'true')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Prepare disposable PostgreSQL image
        run: docker pull postgres:16
      - name: Reproduce DB-01 and verify repaired role boundaries
        run: node scripts/security/verify-ssn-vault.mjs
      - name: Verify capture-link tenant isolation and single-use submissions
        run: node scripts/security/verify-capture-boundary.mjs
      - name: Verify provider roster tenant, audit, and immutable-ledger boundaries
        env:
          P01_DOCKER_CONTEXT: default
        run: node scripts/security/verify-roster-engine.mjs
      - name: Verify V1/V2 fill outcome integrity and tenant boundaries
        env:
          FILLER_OUTCOMES_DOCKER_CONTEXT: default
        run: node scripts/security/verify-filler-outcomes.mjs

  staging-uat-seed:
    name: Deterministic staging UAT seed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (github.event_name != 'pull_request' || needs.changes.outputs.uat == 'true')
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Restore Supabase built-in registry fallback
        shell: bash
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Start and reset local Supabase
        shell: bash
        run: |
          set -euo pipefail
          uat_workdir="$RUNNER_TEMP/mintedpanel-uat"
          mkdir -p "$uat_workdir"
          cp -R supabase "$uat_workdir/supabase"
          printf '\n[db.seed]\nenabled = false\n' >> "$uat_workdir/supabase/config.toml"
          # The repository has two historical migrations at 20260903210000.
          # Supabase's ledger rejects duplicate versions, so the isolated CI
          # copy gives the second file its next timestamp; source stays intact.
          mv "$uat_workdir/supabase/migrations/20260903210000_delete_org_sop_template.sql" \
             "$uat_workdir/supabase/migrations/20260903210001_delete_org_sop_template.sql"
          echo "UAT_SUPABASE_WORKDIR=$uat_workdir" >> "$GITHUB_ENV"
          supabase --workdir "$uat_workdir" start
          # Legacy seed.sql predates the current assignment date constraint;
          # this job owns and applies the dedicated UAT seed immediately after.
          supabase --workdir "$uat_workdir" db reset --no-seed
      - name: Seed twice, verify invariants, and reset deletion pool
        shell: bash
        run: |
          set -euo pipefail
          status_json="$(supabase --workdir "$UAT_SUPABASE_WORKDIR" status -o json)"
          export SUPABASE_URL="$(jq -r '.API_URL' <<<"$status_json")"
          export SUPABASE_SERVICE_ROLE_KEY="$(jq -r '.SERVICE_ROLE_KEY' <<<"$status_json")"
          export UAT_SUPABASE_ANON_KEY="$(jq -r '.ANON_KEY' <<<"$status_json")"
          export UAT_DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          export UAT_SHARED_PASSWORD="$(openssl rand -base64 24)Aa1!"
          npm run seed:staging-uat
          npm run seed:staging-uat
          npm run verify:staging-uat
          deletion_ids="$(jq -r '.ownership.deletionCases | join(",")' scripts/uat/uat-fixture-manifest.json)"
          before="$(psql "$UAT_DATABASE_URL" -Atc "select md5(string_agg(row_to_json(c)::text,',' order by c.id)) from credential_cases c where c.id::text <> all(string_to_array('$deletion_ids',','))")"
          npm run verify:staging-uat:deletion
          npm run seed:staging-uat -- --reset deletion-pool
          npm run verify:staging-uat
          after="$(psql "$UAT_DATABASE_URL" -Atc "select md5(string_agg(row_to_json(c)::text,',' order by c.id)) from credential_cases c where c.id::text <> all(string_to_array('$deletion_ids',','))")"
          test "$before" = "$after"

  e612-http-boundary:
    name: E6.12 native and HTTP boundary
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (github.event_name != 'pull_request' || needs.changes.outputs.security == 'true')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull pinned disposable verification images
        shell: bash
        run: |
          set -euo pipefail
          docker pull postgres@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
          docker pull supabase/postgres@sha256:ac581882596ed0e46937ea6dd53a627d09f53e005d7264c2082a7ff7b62eaaca
          docker pull supabase/gotrue@sha256:839f529492d116b4e8b7777c953a27c381d34c15a744b1bcefde5eefaa1f9f9f
          docker pull postgrest/postgrest@sha256:1791139f50b4939d738c5b0009329aa9e9d4be0a960b6b580c4944b16e157b95
          docker pull supabase/storage-api@sha256:f1546fac6d1c7e345428ac904bfaa7be7cecd50a1f549fe1cf38c628a7b15c85
          docker pull node@sha256:752ea8a2f758c34002a0461bd9f1cee4f9a3c36d48494586f60ffce1fc708e0e

      - name: Verify linux amd64 image resolution
        shell: bash
        run: |
          set -euo pipefail
          for image in \
            postgres@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6 \
            supabase/postgres@sha256:ac581882596ed0e46937ea6dd53a627d09f53e005d7264c2082a7ff7b62eaaca \
            supabase/gotrue@sha256:839f529492d116b4e8b7777c953a27c381d34c15a744b1bcefde5eefaa1f9f9f \
            postgrest/postgrest@sha256:1791139f50b4939d738c5b0009329aa9e9d4be0a960b6b580c4944b16e157b95 \
            supabase/storage-api@sha256:f1546fac6d1c7e345428ac904bfaa7be7cecd50a1f549fe1cf38c628a7b15c85 \
            node@sha256:752ea8a2f758c34002a0461bd9f1cee4f9a3c36d48494586f60ffce1fc708e0e; do
            platform="$(docker image inspect "$image" --format '{{.Os}}/{{.Architecture}}')"
            test "$platform" = linux/amd64
            echo "E612|CI|IMAGE|$image|$platform"
          done

      - name: Build disposable Node server and bind source manifest
        env:
          NITRO_PRESET: node_server
          VITE_SUPABASE_URL: http://gateway:8787
          VITE_SUPABASE_ANON_KEY: e612-build-synthetic-anon-key
        run: |
          npm run build
          node scripts/security/e612-build-manifest.mjs --write

      - name: Verify E6.12 native and HTTP boundaries
        env:
          E612_DOCKER_CONTEXT: default
          E612_POSTGRES_IMAGE: postgres@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
          E612_HTTP_AUTH_IMAGE: supabase/gotrue@sha256:839f529492d116b4e8b7777c953a27c381d34c15a744b1bcefde5eefaa1f9f9f
          E612_HTTP_REST_IMAGE: postgrest/postgrest@sha256:1791139f50b4939d738c5b0009329aa9e9d4be0a960b6b580c4944b16e157b95
        run: |
          node scripts/security/verify-e612-client-access.mjs
          node scripts/security/verify-e612-client-access-http.mjs

      - name: Verify E6.13 enrollment scope SQL contract
        env:
          E613_DOCKER_CONTEXT: default
          E613_POSTGRES_IMAGE: postgres@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
        run: node scripts/security/verify-e613-enrollment-scope.mjs

      - name: Verify E6.14 enrollment report SQL contract and workload
        env:
          E614_DOCKER_CONTEXT: default
          E614_SCALE: "1"
          E614_POSTGRES_IMAGE: postgres@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
        run: node scripts/security/e614-enrollment-report-native.mjs
