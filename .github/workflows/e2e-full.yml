name: Playwright Full E2E

on:
  # Weekly Sunday regression on main (GitHub runs schedules on the default branch only),
  # plus manual dispatch for batch release testing. Kept to weekly Sunday (08:17 UTC)
  # to preserve GitHub runner minute budgets while catching end-to-end regressions.
  schedule:
    - cron: "17 8 * * 0"
  workflow_dispatch:

concurrency:
  # event_name keeps the nightly and a manual dispatch on main in separate
  # groups; otherwise, on the same ref, one cancels the other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-full:
    name: Full E2E regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Write dummy Supabase env
        run: |
          cat > .env <<'ENV'
          VITE_SUPABASE_URL=https://example.supabase.co
          VITE_SUPABASE_ANON_KEY=dummy-anon-key-for-ci
          ENV

      - name: Run Playwright full suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-report
          path: playwright-report/
          retention-days: 7
